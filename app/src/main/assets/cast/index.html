<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AmigoPlay</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:sans-serif}
video{width:100%;height:100%;background:#000;object-fit:contain}
#title{position:absolute;left:28px;top:20px;right:28px;font-size:32px;font-weight:700;text-shadow:0 2px 8px #000}
#err{position:absolute;left:28px;right:28px;bottom:28px;font-size:24px;text-shadow:0 2px 8px #000}
</style>
</head>
<body>
<video id="v" controls autoplay playsinline></video>
<div id="title"></div>
<div id="err"></div>
<script src="/hls.min.js"></script>
<script src="/dash.all.min.js"></script>
<script>
let current = "";
let hls = null;
let dash = null;
function fail(text){ document.getElementById("err").textContent = text || ""; }
function load(now){
  if (!now || !now.url || now.url === current) return;
  current = now.url;
  fail("");
  document.getElementById("title").textContent = now.title || "";
  const video = document.getElementById("v");
  if (hls) { hls.destroy(); hls = null; }
  if (dash) { if (dash.destroy) dash.destroy(); else dash.reset(); dash = null; }
  video.removeAttribute("src");
  video.load();
  if (now.kind === "dash" && window.dashjs) {
    dash = dashjs.MediaPlayer().create();
    dash.initialize(video, now.url, true);
    return;
  }
  if (now.kind !== "dash" && window.Hls && Hls.isSupported()) {
    hls = new Hls({
      enableWorker: false,
      lowLatencyMode: false,
      capLevelToPlayerSize: true,
      maxBufferLength: 20,
      fragLoadingMaxRetry: 6,
      levelLoadingMaxRetry: 4
    });
    hls.on(Hls.Events.ERROR, function(_, data){ if (data && data.fatal) fail("Плеер не смог открыть поток"); });
    hls.on(Hls.Events.MANIFEST_PARSED, function(){ video.play().catch(function(){}); });
    hls.loadSource(now.url);
    hls.attachMedia(video);
    return;
  }
  video.src = now.url;
  video.play().catch(function(){});
  video.onerror = function(){ fail("Плеер не смог открыть поток"); };
}
function poll(){
  fetch("/now.json", { cache: "no-store" })
    .then(function(response){ return response.json(); })
    .then(load)
    .catch(function(){ fail("Нет связи с телефоном"); });
}
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
