<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AmigoPlay</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
video{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;object-fit:contain}
#title{position:absolute;left:28px;top:20px;right:180px;font-size:32px;font-weight:700;text-shadow:0 2px 8px #000}
#vlc{position:absolute;right:28px;top:18px;z-index:2;font-size:28px;font-weight:700;padding:10px 22px;background:#fff;color:#000;border:0}
#err{position:absolute;left:28px;right:28px;bottom:28px;font-size:24px;text-shadow:0 2px 8px #000}
</style>
</head>
<body>
<video id="v" controls autoplay></video>
<button id="vlc" type="button">VLC</button>
<iframe id="vlcframe" hidden></iframe>
<div id="title"></div>
<div id="err"></div>
<script src="/hls.min.js"></script>
<script src="/dash.all.min.js"></script>
<script>
let current = "";
let kind = "hls";
let hls = null;
let dash = null;
document.getElementById("vlc").onclick = function(){
  if (!current) return;
  var scheme = current.indexOf("https://") === 0 ? "https" : "http";
  var body = current.replace(/^https?:\/\//i, "");
  var type = kind === "dash" ? "application/dash+xml" : "application/vnd.apple.mpegurl";
  var intent = "intent://" + body + "#Intent;scheme=" + scheme + ";type=" + type + ";package=org.videolan.vlc;component=org.videolan.vlc/org.videolan.vlc.gui.video.VideoPlayerActivity;end";
  document.getElementById("vlcframe").src = intent;
};
function fail(text){ document.getElementById("err").textContent = text || ""; }
function fill(video){
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    var req = video.requestFullscreen || video.webkitRequestFullscreen || video.webkitEnterFullscreen;
    if (!req) return;
    var result = req.call(video);
    if (result && result.catch) result.catch(function(){});
  } catch (e) {}
}
function load(now){
  if (!now || !now.url || now.url === current) return;
  current = now.url;
  kind = now.kind || "hls";
  fail("");
  document.getElementById("title").textContent = now.title || "";
  const video = document.getElementById("v");
  video.onclick = function(){ fill(video); };
  if (hls) { hls.destroy(); hls = null; }
  if (dash) { if (dash.destroy) dash.destroy(); else dash.reset(); dash = null; }
  video.removeAttribute("src");
  video.load();
  if (now.kind === "dash" && window.dashjs) {
    dash = dashjs.MediaPlayer().create();
    dash.initialize(video, now.url, true);
    fill(video);
    return;
  }
  if (now.kind !== "dash" && window.Hls && Hls.isSupported()) {
    hls = new Hls({
      enableWorker: false,
      lowLatencyMode: false,
      capLevelToPlayerSize: true,
      maxBufferLength: 20,
      fragLoadingMaxRetry: 6,
      levelLoadingMaxRetry: 4
    });
    hls.on(Hls.Events.ERROR, function(_, data){ if (data && data.fatal) fail("Плеер не смог открыть поток"); });
    hls.on(Hls.Events.MANIFEST_PARSED, function(){ fill(video); video.play().catch(function(){}); });
    hls.loadSource(now.url);
    hls.attachMedia(video);
    return;
  }
  video.src = now.url;
  fill(video);
  video.play().catch(function(){});
  video.onerror = function(){ fail("Плеер не смог открыть поток"); };
}
function poll(){
  fetch("/now.json", { cache: "no-store" })
    .then(function(response){ return response.json(); })
    .then(load)
    .catch(function(){ fail("Нет связи с телефоном"); });
}
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
